<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 16 16">
    <defs>
        <!-- Dynamic Multi-Stop Glass Gradient for Center Hexagon -->
        <linearGradient id="centerFacetGrad" x1="5" y1="4" x2="11" y2="12" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#55A829" stop-opacity="0.7" />
            <stop offset="50%" stop-color="#96B41D" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#29A83C" stop-opacity="0.7" />
        </linearGradient>
    </defs>

    <!-- Center 'Glaze' Crystalline Hexagon -->
    <polygon points="8,1 14,4 14,12 8,15 2,12 2,4" fill="url(#centerFacetGrad)" />

    <!-- Crystalline Facet Dividers-->
    <path d="M8 1 L8 8 L14 4 Z" fill="#FFFFFF" opacity="0.75" />
    <path d="M8 8 L2 4 L2 12 Z" fill="#000000" opacity="0.25" />
    <path d="M8 8 L14 12 L8 15 Z" fill="#FFFFFF" opacity="0.25" />
</svg>